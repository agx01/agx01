[project]
name = "market-types"
version = "0.1.0"
description = "Market entity types for Flowsint: issuers, securities, filings, insiders, facts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    # flowsint-types is provided by the Flowsint install this package registers into;
    # it is intentionally not declared here, since it is not published to PyPI.
    # See docs/adr/0003-type-registration-strategy.md.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_types"]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Entity types mirror upstream flowsint_types, which annotates every optional field as
# `Optional[X]` (see flowsint_types/organization.py). Matching that style keeps a
# side-by-side diff with upstream readable, so the modern-union rewrites are off.
ignore = ["UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# Flowsint is installed from source into the runtime image, not as a typed distribution,
# so its base class is Any to us.
[[tool.mypy.overrides]]
module = ["flowsint_types.*", "flowsint_core.*", "flowsint_enrichers.*"]
ignore_missing_imports = true

# Our entity types subclass that untyped base class by design, which strict mode would
# otherwise reject outright. Everything else stays strict.
[[tool.mypy.overrides]]
module = "market_types.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
# src is collected too, so the doctests in the type docstrings are executed rather than
# decorative. _base.py is skipped: it deliberately raises without a Flowsint install.
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules --ignore=src/market_types/_base.py"
pythonpath = ["src"]
